<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1d27"/>
      <stop offset="100%" style="stop-color:#0f1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b84ff"/>
      <stop offset="100%" style="stop-color:#4f6ef7"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#2e3250" stroke-width="2"/>

  <!-- Shield shape -->
  <path d="M64 22 L90 35 L90 62 Q90 82 64 96 Q38 82 38 62 L38 35 Z"
        fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Lock body -->
  <rect x="52" y="58" width="24" height="18" rx="4" fill="url(#accent)"/>

  <!-- Lock shackle -->
  <path d="M56 58 L56 52 Q56 44 64 44 Q72 44 72 52 L72 58"
        fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="64" cy="66" r="3" fill="#0f1117"/>
  <rect x="62.5" y="66" width="3" height="5" rx="1" fill="#0f1117"/>

  <!-- SSH signal dots -->
  <circle cx="64" cy="104" r="2.5" fill="url(#green)"/>
  <circle cx="56" cy="104" r="2.5" fill="url(#accent)" opacity="0.5"/>
  <circle cx="72" cy="104" r="2.5" fill="url(#accent)" opacity="0.5"/>
</svg>
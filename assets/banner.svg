  <!-- Badges row -->
  <g transform="translate(193, 148)">
    <rect width="90" height="26" rx="6" fill="#21253a" stroke="#2e3250" stroke-width="1"/>
    <text x="45" y="17" font-family="monospace" font-size="12" fill="#4f6ef7"
          text-anchor="middle">v3.0.0</text>

    <rect x="98" width="90" height="26" rx="6" fill="#21253a" stroke="#2e3250" stroke-width="1"/>
    <text x="143" y="17" font-family="monospace" font-size="12" fill="#22c55e"
          text-anchor="middle">MIT License</text>

    <rect x="196" width="90" height="26" rx="6" fill="#21253a" stroke="#2e3250" stroke-width="1"/>
    <text x="241" y="17" font-family="monospace" font-size="12" fill="#8892a4"
          text-anchor="middle">Windows 10+</text>

    <rect x="294" width="90" height="26" rx="6" fill="#21253a" stroke="#2e3250" stroke-width="1"/>
    <text x="339" y="17" font-family="monospace" font-size="12" fill="#8892a4"
          text-anchor="middle">Python 3.10+</text>
  </g>

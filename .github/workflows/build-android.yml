name: Build Android APK

on:
  push:
    tags:
      - 'android-v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Download tun2socks binaries
        run: |
          VERSION="v2.6.0"
          BASE="https://github.com/xjasonlyu/tun2socks/releases/download/${VERSION}"

          # arm64
          mkdir -p android/app/src/main/assets/arm64-v8a
          wget -q "${BASE}/tun2socks-linux-arm64.zip" -O /tmp/t2s-arm64.zip
          unzip -o /tmp/t2s-arm64.zip -d /tmp/t2s-arm64/
          mv /tmp/t2s-arm64/tun2socks-linux-arm64 \
             android/app/src/main/assets/arm64-v8a/tun2socks
          chmod +x android/app/src/main/assets/arm64-v8a/tun2socks

          # armv7
          mkdir -p android/app/src/main/assets/armeabi-v7a
          wget -q "${BASE}/tun2socks-linux-armv7.zip" -O /tmp/t2s-armv7.zip
          unzip -o /tmp/t2s-armv7.zip -d /tmp/t2s-armv7/
          mv /tmp/t2s-armv7/tun2socks-linux-armv7 \
             android/app/src/main/assets/armeabi-v7a/tun2socks
          chmod +x android/app/src/main/assets/armeabi-v7a/tun2socks

          # x86_64 (emulator)
          mkdir -p android/app/src/main/assets/x86_64
          wget -q "${BASE}/tun2socks-linux-amd64.zip" -O /tmp/t2s-x64.zip
          unzip -o /tmp/t2s-x64.zip -d /tmp/t2s-x64/
          mv /tmp/t2s-x64/tun2socks-linux-amd64 \
             android/app/src/main/assets/x86_64/tun2socks
          chmod +x android/app/src/main/assets/x86_64/tun2socks

          echo "✓ tun2socks binaries ready"
          ls -lh android/app/src/main/assets/*/tun2socks

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Tunnel-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: SSH Tunnel Android ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    tags:
      - 'android-v*.*.*'
  workflow_dispatch:

jobs:
  build-libbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.0.12077973'
          accept-android-sdk-licenses: true

      - name: Clone sing-box
        run: |
          git clone --depth=1 --branch v1.10.3 \
            https://github.com/SagerNet/sing-box.git /tmp/sing-box

      - name: Install sagernet/gomobile
        run: |
          cd /tmp/sing-box
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Show EXACT libbox API
        run: |
          echo "=== PlatformInterface ==="
          cat /tmp/sing-box/experimental/libbox/platform_interface.go 2>/dev/null || \
          grep -r "type PlatformInterface" /tmp/sing-box/experimental/libbox/ -A 30

          echo ""
          echo "=== TunOptions methods ==="
          grep -r "func.*TunOptions" /tmp/sing-box/experimental/libbox/ | head -40

          echo ""
          echo "=== All Go files in libbox ==="
          ls /tmp/sing-box/experimental/libbox/*.go

          echo ""
          echo "=== tun.go or similar ==="
          cat /tmp/sing-box/experimental/libbox/tun.go 2>/dev/null || \
          grep -r "Inet4Address\|Inet6Address\|Route\|DnsServer\|GetInet" \
            /tmp/sing-box/experimental/libbox/ | head -30

      - name: Build libbox.aar
        run: |
          cd /tmp/sing-box
          go run ./cmd/internal/build_libbox -target android
          ls -lh libbox.aar

      - name: Upload libbox AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: /tmp/sing-box/libbox.aar

  build-apk:
    runs-on: ubuntu-latest
    needs: build-libbox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Download libbox AAR
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: android/app/libs/

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Tunnel-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: SSH Tunnel Android ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

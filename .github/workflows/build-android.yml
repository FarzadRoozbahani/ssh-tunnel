name: Build Android APK

on:
  push:
    tags:
      - 'android-v*.*.*'
  workflow_dispatch:

jobs:
  build-tun2socks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653'
          accept-android-sdk-licenses: true

      - name: Setup gomobile workspace
        run: |
          MOBILE_VERSION=v0.0.0-20240213143359-d1f7d3436075

          # Create a temp module to download mobile source
          mkdir -p /tmp/mobile_setup
          cd /tmp/mobile_setup
          go mod init mobile_setup
          go get golang.org/x/mobile@${MOBILE_VERSION}

          # Install binaries
          go install golang.org/x/mobile/cmd/gobind@${MOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gomobile@${MOBILE_VERSION}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: gomobile init
        run: gomobile init

      - name: Build tun2socks AAR
        working-directory: android/tun2socks
        run: |
          go mod tidy
          gomobile bind \
            -target=android/arm64,android/arm,android/amd64 \
            -androidapi 26 \
            -javapkg Tun2socks \
            -o tun2socks.aar \
            .

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-aar
          path: android/tun2socks/tun2socks.aar

  build-apk:
    runs-on: ubuntu-latest
    needs: build-tun2socks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Download tun2socks AAR
        uses: actions/download-artifact@v4
        with:
          name: tun2socks-aar
          path: android/app/libs/

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSH-Tunnel-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: SSH Tunnel Android ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
